<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        pre { background: #f2f2f2; padding: 12px; overflow-x: auto; }
        button { padding: 8px 16px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Лабораторная работа</h1>
    <p>ФИО: Шкуратов Василий Сергеевич</p>
    <p>GitHub: VasiliyMLCreator</p>
    <p>Docker Hub: texnovasiliy</p>

    <h2>Ответ сервиса api</h2>
    <button id="requestButton">Get response</button>
    <pre id="responseOutput">Нажмите на кнопку</pre>

    <script>
        const requestButton = document.getElementById("requestButton");
        const responseOutput = document.getElementById("responseOutput");

        requestButton.addEventListener("click", async () => {
            responseOutput.textContent = "Загрузка...";
            try {
                const response = await fetch("/api/");
                responseOutput.textContent = await response.text();
            } catch (error) {
                responseOutput.textContent = "Ошибка: " + error;
            }
        });
    </script>
</body>
</html>
