server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
    }
}
